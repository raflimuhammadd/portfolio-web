services:
  app:
    build:
      context: .
      dockerfile: container/php/Dockerfile.dev
    container_name: prattfolio_app
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8002:80"
    volumes:
      - ./src:/var/www/html
      - ./container/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: prattfolio_db
    environment:
      MYSQL_DATABASE: prattfolio_db
      MYSQL_USER: ***
      MYSQL_PASSWORD: ***
      MYSQL_ROOT_PASSWORD: ***
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
