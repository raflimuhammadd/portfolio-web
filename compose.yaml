name: prattfolio

services:
  app:
    build:
      context: ./php
    container_name: prattfolio_app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:Z
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.27-alpine
    container_name: prattfolio_web
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html:Z
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: prattfolio_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prattfolio_db
      MYSQL_USER: pratt
      MYSQL_PASSWORD: tahutek19
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: prattfolio_redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: prattfolio_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data: {}

